# Despliega la imagen del build en un ambiente, verifica la versión y corre las pruebas de integración
# y las end-to-end contra esa misma instancia.
# Lo usan los jobs dev y prod de pipeline.yml, así ambos ambientes se despliegan igual.
name: desplegar

on:
  workflow_call:
    inputs:
      ambiente:
        type: string
        required: true
      puerto:
        type: number
        required: true
      suite:
        description: "regresion (todas las pruebas) o smoke (solo lo básico)"
        type: string
        required: true
      navegador:
        description: "Navegador de las pruebas end-to-end: chromium, firefox o webkit"
        type: string
        required: false
        default: chromium

permissions:
  contents: read

jobs:
  desplegar:
    name: ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGEN: recomendador:${{ github.sha }}
      CONTENEDOR: recomendador-${{ inputs.ambiente }}
      API_URL: http://localhost:${{ inputs.puerto }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements-dev.txt
      - run: pip install -r web/requirements-dev.txt

      - uses: actions/download-artifact@v8
        with:
          name: imagen-${{ github.sha }}
      - name: Cargar la imagen del build (no se reconstruye)
        run: gunzip -c imagen.tar.gz | docker load

      - name: Desplegar en ${{ inputs.ambiente }}
        run: |
          docker run -d --name "$CONTENEDOR" -p "${{ inputs.puerto }}:8000" \
            -e APP_AMBIENTE=${{ inputs.ambiente }} "$IMAGEN"

      - name: Verificar versión y ambiente
        timeout-minutes: 2
        run: python ci/verificar_despliegue.py --url "$API_URL" --sha "${{ github.sha }}" --ambiente "${{ inputs.ambiente }}"

      - name: Pruebas de integración (${{ inputs.suite }})
        timeout-minutes: 5
        run: |
          case "${{ inputs.suite }}" in
            smoke)     filtro="-m smoke" ;;
            regresion) filtro="" ;;
            *) echo "::error::suite desconocida: ${{ inputs.suite }}"; exit 1 ;;
          esac
          pytest tests/integracion $filtro --junitxml="reportes/integracion-${{ inputs.ambiente }}.xml"

      # El contenedor solo existe en este job, por eso las end-to-end corren aquí, contra la misma instancia.
      - name: Instalar el navegador de Playwright (${{ inputs.navegador }})
        timeout-minutes: 5
        run: |
          case "${{ inputs.navegador }}" in
            chromium|firefox|webkit) ;;
            *) echo "::error::navegador desconocido: ${{ inputs.navegador }}"; exit 1 ;;
          esac
          python -m playwright install --with-deps "${{ inputs.navegador }}"

      - name: Pruebas end-to-end (${{ inputs.suite }} en ${{ inputs.navegador }})
        timeout-minutes: 5
        run: |
          case "${{ inputs.suite }}" in
            smoke)     filtro="-m smoke" ;;
            regresion) filtro="" ;;
            *) echo "::error::suite desconocida: ${{ inputs.suite }}"; exit 1 ;;
          esac
          export BASE_URL="$API_URL" AMBIENTE="${{ inputs.ambiente }}" SHA_ESPERADO="${{ github.sha }}"
          echo "URL probada: $BASE_URL | ambiente: $AMBIENTE | navegador: ${{ inputs.navegador }} | suite: ${{ inputs.suite }}"
          pytest tests/e2e $filtro --browser "${{ inputs.navegador }}" -v \
            --junitxml="reportes/e2e-${{ inputs.ambiente }}.xml" \
            --screenshot only-on-failure --output "reportes/e2e-capturas-${{ inputs.ambiente }}"

      - name: Logs del contenedor
        if: always()
        run: docker logs "$CONTENEDOR" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-integracion-${{ inputs.ambiente }}
          path: reportes/
          if-no-files-found: ignore
