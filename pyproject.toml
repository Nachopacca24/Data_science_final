[tool.pytest.ini_options]
pythonpath = ["."]          # para que las pruebas importen web.api
testpaths = ["tests/unitarias"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["web/**/*.py", "ci/**/*.py", "tests/unitarias/**/*.py", "tests/integracion/**/*.py", "tests/e2e/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["web", "src", "conftest", "paginas"]

# Puerta de cobertura: solo los módulos de negocio (ver DECISIONES.md, sección 5).
[tool.coverage.run]
branch = true
source = ["web/api"]
# Fuera de la puerta: conexión HTTP, formato de errores y configuración (los cubren integración y e2e).
omit = ["web/api/__init__.py", "web/api/main.py", "web/api/errores.py", "web/api/config.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
